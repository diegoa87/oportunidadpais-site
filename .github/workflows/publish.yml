name: Publish Oportunidad País
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build a public-only asset bundle
        run: python3 scripts/build_static.py
      - name: Publish Cloudflare Worker and static assets
        env:
          CI: '1'
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_AUTH_EMAIL }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_AUTH_KEY }}
        run: npx --yes wrangler@4 deploy --name oportunidadpais-site
